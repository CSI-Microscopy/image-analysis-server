# Builds this repo's Markdown into static pages and deploys them to GitHub Pages,
# with the shared CSI Microscopy workflow (csi-Microscopy.github.io/tools/build-docs),
# pinned to its release tag v1.
# Needs Settings → Pages → Source: GitHub Actions (the repo no longer contains a branch-served site).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 5 * * 1'   # weekly, so a new release of the shared build (the v1 tag moved) reaches this site

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: CSI-Microscopy/csi-Microscopy.github.io/.github/workflows/build-instrument-site.yml@v1
    with:
      repo: image-analysis-server
      branch: main          # deploy only from main
      site: site.json
