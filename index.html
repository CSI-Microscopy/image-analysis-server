<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Faculty of Agriculture CSI Microscopy — image data management on the analysis server.">
    <title>CSI Microscopy — Image Data Management</title>
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0A716E">
    <link rel="icon" href="https://csi-microscopy.github.io/assets/favicon.svg" type="image/svg+xml">
    <!-- Apply the saved (or system) theme before first paint to avoid a flash -->
    <script>
        var t = null;
        try { t = localStorage.getItem('csi-theme'); } catch (e) { /* storage blocked: fall back to the system theme */ }
        if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://csi-microscopy.github.io/styles.css">
    <link rel="stylesheet" href="https://csi-microscopy.github.io/guides/guide.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i></button>
        <a href="https://csi-microscopy.github.io/index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> <span class="text">Home</span></a>
    </nav>

    <main>
        <section id="guide-content">
            <div id="status-message"><i class="fa-solid fa-spinner fa-spin"></i> Loading guide…</div>
            <h1 id="guide-title" style="display:none;"></h1>
            <p class="guide-meta" id="guide-meta" style="display:none;"></p>
            <div id="markdown-body"></div>
        </section>

        <footer>
            <p>&copy; 2025 Daniel Waiger · Faculty of Agriculture CSI Microscopy</p>
        </footer>
    </main>

    <!-- This repo's own README, rendered with the shared CSI Microscopy renderer.
         A ?path= / ?title= query overrides the defaults below. -->
    <script>
        window.GUIDE = { repo: 'image-analysis-server', branch: 'main', title: 'Image Data Management' };
    </script>
    <script src="https://csi-microscopy.github.io/guides/render.js"></script>
</body>
</html>
